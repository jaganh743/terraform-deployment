<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Assessment App</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 48px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            max-width: 500px;
        }
        h1 { color: #333; font-size: 2rem; margin-bottom: 12px; }
        p  { color: #666; font-size: 1.1rem; line-height: 1.6; }
        .badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 6px 16px;
            border-radius: 999px;
            font-size: 0.85rem;
            margin-top: 24px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 Production Web App</h1>
        <p>Deployed on AWS with containerized Nginx, auto-scaling, and a load balancer via Terraform.</p>
        <span class="badge">Running on ECS Fargate</span>
    </div>
</body>
</html>
